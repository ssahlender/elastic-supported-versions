<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elasticsearch Supported Versions</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Maintenance reference</p>
          <h1 id="page-title">Elasticsearch Supported Versions</h1>
          <p class="summary" id="summary">Loading current maintenance data...</p>
        </div>
        <nav class="top-links" aria-label="Reference links">
          <a href="https://www.elastic.co/support/eol">Elastic EOL policy</a>
          <a href="https://github.com/elastic/elasticsearch/releases">Elasticsearch releases</a>
        </nav>
      </header>

      <section class="meta-strip" aria-live="polite">
        <dl>
          <div>
            <dt>Evaluated</dt>
            <dd id="evaluated-at">-</dd>
          </div>
          <div>
            <dt>Product</dt>
            <dd id="product">-</dd>
          </div>
          <div>
            <dt>Sources</dt>
            <dd id="sources">-</dd>
          </div>
        </dl>
      </section>

      <section class="versions-panel" aria-labelledby="versions-title">
        <div class="section-heading">
          <h2 id="versions-title">Maintained minor lines</h2>
          <span class="count-pill" id="line-count">-</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Line</th>
                <th scope="col">Latest</th>
                <th scope="col">Released</th>
                <th scope="col">Maintenance through</th>
                <th scope="col">Policy basis</th>
                <th scope="col">Release</th>
              </tr>
            </thead>
            <tbody id="version-table-body"></tbody>
          </table>
        </div>
        <p class="error-message" id="error-message" hidden></p>
      </section>
    </main>

    <template id="version-row-template">
      <tr>
        <td data-label="Line"><strong data-field="minor_line"></strong></td>
        <td data-label="Latest"><span data-field="latest_release"></span></td>
        <td data-label="Released"><span data-field="released"></span></td>
        <td data-label="Maintenance through"><span data-field="end_of_maintenance"></span></td>
        <td data-label="Policy basis"><span data-field="reason"></span></td>
        <td data-label="Release"><a data-field="url" href="#">Open</a></td>
      </tr>
    </template>

    <script>
      async function loadVersions() {
        const response = await fetch("data.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Could not load generated version data.");
        }
        return response.json();
      }

      function render(data) {
        const lines = data.maintained_minor_lines || [];
        document.getElementById("evaluated-at").textContent = data.evaluated_at || "-";
        document.getElementById("product").textContent = data.product || "-";
        document.getElementById("sources").textContent = (data.sources || []).join(", ") || "-";
        document.getElementById("line-count").textContent = `${lines.length} active`;
        document.getElementById("summary").textContent =
          lines.length === 1
            ? "1 minor line is currently within Elastic maintenance policy."
            : `${lines.length} minor lines are currently within Elastic maintenance policy.`;

        const template = document.getElementById("version-row-template");
        const body = document.getElementById("version-table-body");
        body.replaceChildren();

        for (const line of lines) {
          const row = template.content.cloneNode(true);
          row.querySelector('[data-field="minor_line"]').textContent = line.minor_line;
          row.querySelector('[data-field="latest_release"]').textContent = line.latest_release;
          row.querySelector('[data-field="released"]').textContent = line.released;
          row.querySelector('[data-field="end_of_maintenance"]').textContent = line.end_of_maintenance;
          row.querySelector('[data-field="reason"]').textContent = line.reason;
          const link = row.querySelector('[data-field="url"]');
          link.href = line.url;
          body.appendChild(row);
        }
      }

      loadVersions()
        .then(render)
        .catch((error) => {
          document.getElementById("summary").textContent = "Version data is unavailable.";
          const errorMessage = document.getElementById("error-message");
          errorMessage.textContent = error.message;
          errorMessage.hidden = false;
        });
    </script>
  </body>
</html>
